<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Busca CEP</title>
    <!-- Carregando Tailwind CSS para estilização rápida e moderna -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Carregando fonte Inter do Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* Fundo com um gradiente suave */
            background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
        }
        /* Pequena animação para o botão de carregamento */
        .spinner {
            border: 3px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Estilos Didáticos */
        .highlight-active {
            background-color: #fef08a !important; /* Amarelo (yellow-200) */
            color: #854d0e !important; /* Texto escuro (yellow-800) */
            box-shadow: 0 0 0 4px #fef08a; /* Borda suave */
            border-radius: 0.25rem;
            transition: all 0.2s ease;
        }
        
        .log-line {
            animation: fadeIn 0.3s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- ID 'main-card' adicionado e classes de transição de largura incluídas -->
    <div id="main-card" class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 sm:p-8 border border-gray-100 transition-all duration-700 ease-in-out">
        
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 bg-blue-100 rounded-full mb-3">
                <svg class="w-6 h-6 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-800">Busca CEP</h1>
            <p class="text-sm text-gray-500 mt-1">Encontre endereços de todo o Brasil</p>
        </div>

        <div class="mb-6">
            <label for="cep-input" class="block text-sm font-medium text-gray-700 mb-2">Digite o CEP</label>
            <div class="flex gap-2">
                <input 
                    type="text" 
                    id="cep-input" 
                    maxlength="9" 
                    placeholder="00000-000" 
                    class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all text-gray-700 text-lg"
                    autocomplete="off"
                >
                <button 
                    id="search-btn" 
                    class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-6 py-3 rounded-lg transition-colors flex items-center justify-center min-w-[100px] shadow-sm"
                >
                    <span id="btn-text">Buscar</span>
                    <div id="btn-spinner" class="spinner hidden"></div>
                </button>
            </div>
            <p id="error-msg" class="text-red-500 text-sm mt-2 hidden opacity-0 transition-opacity duration-300"></p>
        </div>

        <!-- Resultados (Oculto por padrão) -->
        <div id="result-container" class="hidden overflow-hidden transition-all duration-500 ease-in-out mt-6 pt-6 border-t border-gray-100">
            <div class="flex flex-col lg:flex-row gap-8">
                
                <!-- Coluna Esquerda: Interface -->
                <div class="flex-1 space-y-4">
                    <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                        1. A Interface (O que o usuário vê)
                    </h3>
                    
                    <div class="bg-gray-50 rounded-xl p-5 border border-gray-200 shadow-inner space-y-4">
                        <div class="flex flex-col border-b border-gray-200 pb-3">
                            <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Logradouro</span>
                            <span id="res-logradouro" data-map="logradouro" class="text-gray-800 font-medium text-lg px-2 py-1 -ml-2 rounded transition-colors inline-block w-fit">...</span>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 border-b border-gray-200 pb-3">
                            <div class="flex flex-col">
                                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Bairro</span>
                                <span id="res-bairro" data-map="bairro" class="text-gray-800 font-medium px-2 py-1 -ml-2 rounded transition-colors inline-block w-fit">...</span>
                            </div>
                            
                            <div class="flex flex-col">
                                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Complemento</span>
                                <span id="res-complemento" data-map="complemento" class="text-gray-800 font-medium px-2 py-1 -ml-2 rounded transition-colors inline-block w-fit">...</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4">
                            <div class="flex flex-col">
                                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">Cidade</span>
                                <span id="res-localidade" data-map="localidade" class="text-gray-800 font-medium px-2 py-1 -ml-2 rounded transition-colors inline-block w-fit">...</span>
                            </div>
                            
                            <div class="flex flex-col">
                                <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-1">UF</span>
                                <span id="res-uf" data-map="uf" class="text-gray-800 font-medium px-2 py-1 -ml-2 rounded transition-colors inline-block w-fit">...</span>
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Coluna Direita: Por trás dos panos -->
                <div class="flex-1 space-y-4">
                    <h3 class="text-sm font-bold text-gray-700 uppercase tracking-wider mb-4 flex items-center gap-2">
                        <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path></svg>
                        2. Por Trás dos Panos (O Sistema)
                    </h3>
                    
                    <!-- Simulação de Rede / Terminal -->
                    <div class="bg-slate-900 rounded-lg p-3 overflow-hidden shadow-inner flex flex-col min-h-[150px] border border-slate-700">
                        <div class="flex items-center gap-2 border-b border-slate-700 pb-2 mb-2">
                            <div class="w-3 h-3 rounded-full bg-red-500"></div>
                            <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                            <div class="w-3 h-3 rounded-full bg-green-500"></div>
                            <span class="text-slate-400 text-xs font-mono ml-2">Console de Rede (Fetch)</span>
                        </div>
                        <div id="network-log" class="overflow-y-auto flex-1 font-mono text-sm space-y-1 pr-2 scrollbar-thin">
                            <!-- Logs serão injetados aqui via JS -->
                        </div>
                    </div>

                    <!-- JSON Interativo -->
                    <div class="bg-slate-900 rounded-lg p-4 overflow-x-auto shadow-inner border border-slate-700">
                        <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 block flex items-center justify-between">
                            Resposta Bruta (JSON)
                            <span class="text-[10px] bg-slate-800 text-slate-300 px-2 py-1 rounded border border-slate-600">Interativo</span>
                        </span>
                        <pre><code id="res-json" class="text-sm text-emerald-400 font-mono leading-relaxed block min-h-[150px]"></code></pre>
                    </div>
                </div>
                
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cepInput = document.getElementById('cep-input');
            const searchBtn = document.getElementById('search-btn');
            const btnText = document.getElementById('btn-text');
            const btnSpinner = document.getElementById('btn-spinner');
            const errorMsg = document.getElementById('error-msg');
            const resultContainer = document.getElementById('result-container');
            const mainCard = document.getElementById('main-card');

            // Elementos de resultado
            const resLogradouro = document.getElementById('res-logradouro');
            const resBairro = document.getElementById('res-bairro');
            const resComplemento = document.getElementById('res-complemento');
            const resLocalidade = document.getElementById('res-localidade');
            const resUf = document.getElementById('res-uf');
            const resJson = document.getElementById('res-json');
            const logBox = document.getElementById('network-log');

            // Máscara do CEP
            cepInput.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.length > 5) {
                    value = value.replace(/^(\d{5})(\d)/, '$1-$2');
                }
                e.target.value = value;
                hideError();
            });

            cepInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') buscarCEP();
            });

            searchBtn.addEventListener('click', buscarCEP);

            // Delegação de eventos para o destaque (Hover Data Binding)
            document.addEventListener('mouseover', (e) => {
                const mapEl = e.target.closest('[data-map]');
                if (mapEl) {
                    const key = mapEl.getAttribute('data-map');
                    // Destaca todos os elementos (na interface e no JSON) que possuem o mesmo mapa
                    document.querySelectorAll(`[data-map="${key}"]`).forEach(el => el.classList.add('highlight-active'));
                }
            });

            document.addEventListener('mouseout', (e) => {
                const mapEl = e.target.closest('[data-map]');
                if (mapEl) {
                    const key = mapEl.getAttribute('data-map');
                    document.querySelectorAll(`[data-map="${key}"]`).forEach(el => el.classList.remove('highlight-active'));
                }
            });

            function showError(message, retract = false) {
                errorMsg.textContent = message;
                errorMsg.classList.remove('hidden');
                setTimeout(() => errorMsg.classList.remove('opacity-0'), 10);
                
                // Se for um erro de validação inicial, encolhe o painel
                if(retract) {
                    collapseCard();
                    resultContainer.classList.add('hidden');
                }
            }

            function hideError() {
                errorMsg.classList.add('opacity-0');
                setTimeout(() => errorMsg.classList.add('hidden'), 300);
            }

            function setLoading(isLoading) {
                if (isLoading) {
                    btnText.classList.add('hidden');
                    btnSpinner.classList.remove('hidden');
                    searchBtn.disabled = true;
                    searchBtn.classList.add('opacity-75', 'cursor-not-allowed');
                } else {
                    btnText.classList.remove('hidden');
                    btnSpinner.classList.add('hidden');
                    searchBtn.disabled = false;
                    searchBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                }
            }

            function expandCard() {
                mainCard.classList.remove('max-w-md');
                mainCard.classList.add('max-w-5xl'); // Expande para visualização lado a lado
            }

            function collapseCard() {
                mainCard.classList.remove('max-w-5xl');
                mainCard.classList.add('max-w-md');
            }

            function resetUI() {
                // Zera os campos visuais enquanto carrega
                const fields = [resLogradouro, resBairro, resComplemento, resLocalidade, resUf];
                fields.forEach(el => el.textContent = '...');
                resJson.innerHTML = '<span class="text-slate-500 animate-pulse">// Aguardando processamento...</span>';
                logBox.innerHTML = '';
            }

            // Transforma o objeto JSON em HTML interativo com spans
            function renderDidacticJSON(data) {
                let html = '<span class="text-gray-300">{</span>\n';
                const keys = Object.keys(data);
                
                keys.forEach((key, index) => {
                    const isLast = index === keys.length - 1;
                    const comma = isLast ? '' : '<span class="text-gray-300">,</span>';
                    const val = data[key];
                    
                    // Verifica se essa chave está mapeada na nossa UI
                    const hasMapping = ['logradouro', 'bairro', 'complemento', 'localidade', 'uf'].includes(key);
                    
                    let valueHtml = '';
                    if (hasMapping && val !== '') {
                        valueHtml = `<span class="text-emerald-400 transition-colors duration-200 rounded px-1 cursor-help border-b border-dashed border-emerald-500/50 hover:bg-emerald-900/50" data-map="${key}" title="Passe o mouse para ver na interface">"${val}"</span>`;
                    } else {
                        valueHtml = `<span class="text-emerald-400">"${val}"</span>`;
                    }

                    html += `  <span class="text-pink-400">"${key}"</span><span class="text-gray-300">:</span> ${valueHtml}${comma}\n`;
                });
                
                html += '<span class="text-gray-300">}</span>';
                resJson.innerHTML = html;
            }

            async function buscarCEP() {
                const cep = cepInput.value.replace(/\D/g, '');
                
                if (cep.length !== 8) {
                    showError('Por favor, digite um CEP válido com 8 números.', true);
                    return;
                }

                hideError();
                setLoading(true);
                expandCard();
                
                // Exibe container instantaneamente, mas com dados zerados para acompanhar o fluxo
                resultContainer.classList.remove('hidden');
                resetUI();

                // Função utilitária para criar "pausas" didáticas e ver as coisas acontecendo
                const sleep = ms => new Promise(r => setTimeout(r, ms));
                
                // Função para adicionar linhas no nosso terminal fake
                const addLog = (msg, type = 'info') => {
                    const p = document.createElement('div');
                    const color = type === 'error' ? 'text-red-400' : (type === 'success' ? 'text-emerald-400' : 'text-blue-300');
                    p.className = `log-line text-xs ${color} py-0.5`;
                    const time = new Date().toISOString().split('T')[1].slice(0, 12); 
                    p.innerHTML = `<span class="text-slate-600 mr-2">[${time}]</span> ${msg}`;
                    logBox.appendChild(p);
                    logBox.scrollTop = logBox.scrollHeight; // Auto-scroll para a última mensagem
                };

                try {
                    await sleep(400);
                    addLog('Inicializando requisição...', 'info');
                    await sleep(400);
                    addLog(`GET https://viacep.com.br/ws/${cep}/json/`, 'info');
                    
                    const startTime = Date.now();
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const elapsed = Date.now() - startTime;
                    
                    // Pausa didática para que os passos não ocorram rápido demais aos olhos humanos
                    if (elapsed < 1000) await sleep(1000 - elapsed); 
                    
                    if (!response.ok) throw new Error('Erro HTTP ' + response.status);
                    
                    addLog(`STATUS: ${response.status} ${response.statusText}`, 'success');
                    await sleep(400);
                    
                    addLog('Baixando pacote JSON...', 'info');
                    const data = await response.json();
                    await sleep(500);

                    if (data.erro) {
                        addLog('Servidor retornou: { erro: "true" }', 'error');
                        addLog('CEP não existe na base dos Correios.', 'error');
                        showError('CEP não encontrado na base de dados.', false);
                        setLoading(false);
                        return;
                    }

                    addLog('JSON interpretado. Iniciando mapeamento (Data Binding)...', 'success');
                    await sleep(800);

                    // Preenche a interface visual
                    resLogradouro.textContent = data.logradouro || 'Não informado';
                    resBairro.textContent = data.bairro || 'Não informado';
                    resComplemento.textContent = data.complemento || '-';
                    resLocalidade.textContent = data.localidade;
                    resUf.textContent = data.uf;

                    // Constrói o HTML do JSON interativo
                    renderDidacticJSON(data);
                    
                    addLog('Processo concluído! Explore passando o mouse.', 'success');
                    
                } catch (error) {
                    addLog(`FALHA: ${error.message}`, 'error');
                    showError('Ocorreu um erro de rede. Tente novamente.', false);
                } finally {
                    setLoading(false);
                }
            }
        });
    </script>
</body>
</html>
