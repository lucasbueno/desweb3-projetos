services:
  react-dev:
    image: node:22-alpine
    container_name: vite_react_dev
    # Mapeia o usuário padrão para evitar arquivos criados como root
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./meu-projeto:/app
    ports:
      - "5173:5173"
    # O '-- --host' instrui o Vite a escutar em 0.0.0.0 dentro do container
    command: npm run dev -- --host
    stdin_open: true
    tty: true
